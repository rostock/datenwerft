services:

  server:
    networks:
      default:
      gateway:
    ports: !override []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.datenwerft_hro-server.rule=Host(`datenwerft.hro.localhost`)"
      - "traefik.http.services.datenwerft_hro-server.loadbalancer.server.port=8000"
      - "traefik.docker.network=gateway"

  smtp:
    image: docker.brayn.io/docker/docker-hub/axllent/mailpit:v1.24
    networks:
      default:
      gateway:
    ports: !override []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.datenwerft_hro-smtp.rule=Host(`mail.datenwerft.hro.localhost`)"
      - "traefik.http.services.datenwerft_hro-smtp.loadbalancer.server.port=8025"
      - "traefik.docker.network=gateway"

networks:
  gateway:
    external: true
